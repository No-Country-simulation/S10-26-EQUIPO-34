services:
  postgres:
    image: postgres:17
    container_name: repusense-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-repusense}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-repusense_secret}
      POSTGRES_DB: ${POSTGRES_DB:-repusense_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - repusense_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-repusense} -d ${POSTGRES_DB:-repusense_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  repusense_pgdata:
    driver: local
